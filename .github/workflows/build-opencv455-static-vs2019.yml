name: build-opencv455-static-vs2019

on:
  workflow_dispatch:   # Actions 页面 → Run workflow 手动触发

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: 安装完整 VS 2019 Build Tools（含 C++ 工作负载）
        shell: powershell
        run: |
          # 通过 Chocolatey 安装 VS 2019 Build Tools，含 VC++ 工具链和推荐组件
          # 安装后位于 C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools
          choco install visualstudio2019buildtools `
            --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --passive --norestart" `
            --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 校验 VS 2019 Build Tools 已安装
        shell: powershell
        run: |
          $vcvars = "C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) {
            Write-Error "vcvars64.bat not found: $vcvars"
            exit 1
          }
          Write-Host "Found: $vcvars"
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" `
            -products '*' -version '[16.0,17.0)' -property installationPath

      - name: 拉取 OpenCV 4.5.5 源码
        uses: actions/checkout@v4
        with:
          repository: opencv/opencv
          ref: 4.5.5
          path: opencv

      - name: 拉取 opencv_contrib 4.5.5（现有构建含全部 contrib 模块）
        uses: actions/checkout@v4
        with:
          repository: opencv/opencv_contrib
          ref: 4.5.5
          path: opencv_contrib

      - name: 固定 CMake 3.30（OpenCV 4.5.5 的脚本与 CMake 4.x 不兼容）
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.x'

      # 历次产物均为 /MT 的根因：OpenCV 4.5.5 的 OpenCVCRTLinkage.cmake 会在
      # 静态构建时强制 CRT——BUILD_WITH_STATIC_CRT 默认为 ON（顶层 CMakeLists
      # 第 472 行），把 /MD 全部替换成 /MT（CMAKE_MSVC_RUNTIME_LIBRARY 和
      # CMAKE_CXX_FLAGS 里的 /MD 都会被它覆盖）。
      # 设 OFF 后 OpenCV 反向执行 /MT→/MD，配合显式 /MD 标志，保证动态 CRT。
      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S opencv -B build ^
            -G "Visual Studio 16 2019" -A x64 ^
            -DCMAKE_CONFIGURATION_TYPES=Release ^
            -DBUILD_WITH_STATIC_CRT=OFF ^
            -DCMAKE_CXX_FLAGS="/MD" -DCMAKE_C_FLAGS="/MD" ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DBUILD_opencv_world=ON ^
            -DOPENCV_EXTRA_MODULES_PATH=opencv_contrib/modules ^
            -DOPENCV_ENABLE_NONFREE=ON ^
            -DBUILD_opencv_barcode=ON ^
            -DWITH_FFMPEG=OFF ^
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF ^
            -DBUILD_opencv_python3=OFF -DBUILD_opencv_python2=OFF -DBUILD_JAVA=OFF

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build --config Release

      - name: Install（产出干净的 include / lib）
        run: cmake --install build --config Release --prefix install

      - name: 校验产物
        shell: bash
        run: |
          echo "== 模块数量 =="
          grep -c HAVE_OPENCV install/include/opencv2/opencv_modules.hpp
          echo "== 安装目录 =="
          find install -maxdepth 3 -type d | sort
          echo "== static libs =="
          find install -path '*/lib/*.lib' -type f | sort

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: opencv455-static-vs2019
          path: install/**
